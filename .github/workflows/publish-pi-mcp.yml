name: Publish pi-mcp

on:
  release:
    types: [published]

concurrency:
  group: publish-pi-mcp-${{ github.ref }}
  cancel-in-progress: true

# Only publish released versions to npm — no push-triggered or manual publishing.
# Pre-releases are skipped entirely (job-level if), and the release tag must
# match the package.json version before anything runs.
jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.release.prerelease == false
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: 'pi-mcp/package-lock.json'

      - name: Validate release tag matches package.json version
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION=$(node -p "require('./pi-mcp/package.json').version")
          echo "tag=${TAG}"
          echo "version=${VERSION}"
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::Release tag '${TAG}' does not match package.json version '${VERSION}'"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci
        working-directory: pi-mcp

      - name: Run tests
        run: npm test
        working-directory: pi-mcp

      - name: Publish to npm
        run: npm publish
        working-directory: pi-mcp
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}